<section class="body-map" aria-label="Mapa muscular interactivo">
  <div class="body-map__stage">
    <!-- Controles Toggle (Solo labels alineados en columna a la izquierda) -->
    <div class="body-map__switches-toolbar" aria-label="Controles del mapa corporal">
      <!-- Toggle 1: Hombre / Mujer -->
      <button
        type="button"
        class="body-map__toggle-btn"
        (click)="toggleGender()"
        [title]="selectedGender === 'male' ? 'Cambiar a Mujer' : 'Cambiar a Hombre'">
        {{ selectedGender === 'male' ? 'Hombre' : 'Mujer' }}
      </button>

      <!-- Toggle 2: Avanzado / Estándar -->
      <button
        type="button"
        class="body-map__toggle-btn"
        (click)="toggleAnatomyMode()"
        [title]="currentMuscleModeLabel === 'Avanzado' ? 'Cambiar a Estándar' : 'Cambiar a Avanzado'">
        {{ currentMuscleModeLabel }}
      </button>

      <!-- Toggle 3: Músculos / Articulaciones -->
      <button
        type="button"
        class="body-map__toggle-btn"
        [class.is-active]="isJointsMode"
        (click)="toggleJoints()"
        [title]="isJointsMode ? 'Cambiar a Músculos' : 'Cambiar a Articulaciones'">
        {{ isJointsMode ? 'Articulaciones' : 'Músculos' }}
      </button>
    </div>

    <!-- Badge de Músculo seleccionado: altura generosa, texto completo sin truncar, ubicado en la zona libre -->
    @if (shouldShowOverlay && selectedRegion; as region) {
      <div class="body-map__selected-badge" role="status" aria-live="polite">
        <div class="body-map__badge-top">
          <span class="body-map__badge-dot"></span>
          <button
            type="button"
            class="body-map__badge-close"
            (click)="clearSelection()"
            aria-label="Quitar selección"
            title="Desmarcar">
            <i class="pi pi-times"></i>
          </button>
        </div>
        <div class="body-map__badge-name">{{ region.name }}</div>
      </div>
    }

    <div class="body-map__figures" (click)="onSvgClick($event)" (keydown)="onSvgKeydown($event)">
      @if (showFront) {
        <figure
          class="body-map__figure body-map__figure--front"
          [class.is-main]="activeView === 'front'"
          [class.is-thumbnail]="activeView !== 'front'"
          [attr.role]="activeView !== 'front' ? 'button' : null"
          [attr.tabindex]="activeView !== 'front' ? 0 : null"
          [attr.aria-label]="activeView !== 'front' ? 'Cambiar a vista anterior' : 'Vista anterior'"
          (click)="switchView('front', $event)"
          (keydown.enter)="switchView('front', $event)"
          (keydown.space)="switchView('front', $event)">
          <figcaption>
            <span>Vista anterior</span>
            <i class="pi pi-sync"></i>
          </figcaption>

          <app-body-map-model-svg
            [gender]="selectedGender"
            [anatomyMode]="anatomyMode"
            view="front"
            [isJointsMode]="isJointsMode" />
        </figure>
      }

      @if (showBack) {
        <figure
          class="body-map__figure body-map__figure--back"
          [class.is-main]="activeView === 'back'"
          [class.is-thumbnail]="activeView !== 'back'"
          [attr.role]="activeView !== 'back' ? 'button' : null"
          [attr.tabindex]="activeView !== 'back' ? 0 : null"
          [attr.aria-label]="activeView !== 'back' ? 'Cambiar a vista posterior' : 'Vista posterior'"
          (click)="switchView('back', $event)"
          (keydown.enter)="switchView('back', $event)"
          (keydown.space)="switchView('back', $event)">
          <figcaption>
            <span>Vista posterior</span>
            <i class="pi pi-sync"></i>
          </figcaption>

          <app-body-map-model-svg
            [gender]="selectedGender"
            [anatomyMode]="anatomyMode"
            view="back"
            [isJointsMode]="isJointsMode" />
        </figure>
      }
    </div>
  </div>
</section>
