<p-drawer [(visible)]="visible" position="bottom" appendTo="body" [showCloseIcon]="false"
  [style]="{ height: 'auto', maxHeight: '80dvh', width: '100%', maxWidth: '540px', margin: '0 auto', borderTopLeftRadius: '24px', borderTopRightRadius: '24px', backgroundColor: 'var(--app-bg, #ffffff)' }"
  styleClass="border border-stone-200 [&_.p-drawer-header]:!hidden [&_.p-drawer-content]:!p-0">
  <div class="bg-white text-stone-900 w-full rounded-t-3xl pb-6 pt-3 px-4 space-y-3">
    <div class="w-10 h-1 rounded-full bg-stone-300 mx-auto"></div>

    <div class="flex items-center justify-between px-1">
      <h3 class="text-sm font-black tracking-tight text-stone-900">Seleccionar Tipo de Serie</h3>
      <button type="button" (click)="visible.set(false)"
        class="w-7 h-7 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-500 flex items-center justify-center cursor-pointer">
        <i class="pi pi-times text-[10px]"></i>
      </button>
    </div>

    <div class="bg-stone-50 rounded-2xl divide-y divide-stone-200/80 overflow-hidden border border-stone-200">
      @for (opt of options; track opt.type) {
        <div class="transition-colors" [ngClass]="currentType() === opt.type ? 'bg-amber-500/10' : 'hover:bg-stone-100'">
          <div (click)="select(opt.type)" class="flex items-center justify-between px-4 py-3 cursor-pointer">
            <div class="flex items-center gap-3.5 min-w-0">
              <span class="w-6 text-center text-sm font-black"
                [ngClass]="opt.type === 'WORKING' ? 'text-stone-900' : opt.colorClass">
                {{ opt.type === 'WORKING' ? setNumber() : opt.letter }}
              </span>
              <span class="text-xs font-bold text-stone-800 truncate">{{ opt.label }}</span>
              @if (currentType() === opt.type) {
                <i class="pi pi-check text-[10px] text-kin-primary font-black"></i>
              }
            </div>
            <button type="button" (click)="toggleInfo(opt.type, $event)"
              class="w-6 h-6 rounded-full bg-stone-200/80 hover:bg-stone-300 text-stone-600 flex items-center justify-center text-[10px] font-black cursor-pointer shrink-0"
              title="Información">
              <i class="pi pi-info text-[9px]"></i>
            </button>
          </div>
          @if (expandedInfo() === opt.type) {
            <div class="px-4 pb-3 pt-1 text-[11px] text-stone-600 leading-snug bg-white/70 border-t border-stone-200/50">
              {{ opt.description }}
            </div>
          }
        </div>
      }

      @if (canDelete()) {
        <button type="button" (click)="remove()"
          class="w-full flex items-center gap-3.5 px-4 py-3 text-left text-rose-600 hover:bg-rose-50 cursor-pointer">
          <span class="w-6 text-center"><i class="pi pi-times text-xs"></i></span>
          <span class="text-xs font-bold">Eliminar Serie</span>
        </button>
      }
    </div>
  </div>
</p-drawer>
